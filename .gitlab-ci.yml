default:
  image: ubuntu:latest

stages:
  - build
  - release

build:
  stage: build
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get -qq update
    - > 
      apt-get -qq install -y python3-pip ninja-build libglib2.0-dev
      libxml2-utils zip gettext
    - pip3 install meson
    - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
    - export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
    - nvm install node
    - npm install -g eslint eslint-plugin-jsdoc
  script:
    - meson _build -Dper_user=true -Dbuild_zip=true
    - meson test -C _build
    - meson install -C _build
