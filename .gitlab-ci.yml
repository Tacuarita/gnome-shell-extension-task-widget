default:
  image: ubuntu:latest

stages:
  - build
  - release

build:
  stage: build
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get -qq update
    - > 
      apt-get -qq install -y python3-pip ninja-build libglib2.0-dev
      libxml2-utils npm zip gettext
    - pip3 install meson
    - npm install -g eslint
  script:
    - meson _build -Dper_user=true -Dbuild_zip=true
    - meson test -C _build
    - meson install -C _build
